[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physgauss-sde"
version = "0.1.0"
description = "Physically constrained Gaussian rendering and uncertainty from irregular monocular observations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.2", "Pillow>=10", "matplotlib>=3.8"]

[project.scripts]
physgauss = "physgauss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

