name: Continue immutable reflected Bird CPU chains
on:
  workflow_dispatch:
    inputs:
      parent_run:
        description: Run containing four bird-reflected-chain artifacts
        required: true
        default: '39399618548'
      draws:
        description: Total retained draws per chain after exact continuation
        type: choice
        options: ['2000', '4000', '8000']
        default: '4000'
permissions:
  contents: read
  actions: read
jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: {index: [0, 1, 2, 3]}
    defaults:
      run: {working-directory: worker}
    steps:
      - uses: actions/checkout@v4
        with: {path: control}
      - uses: actions/checkout@v4
        with: {path: worker, ref: ad3ec582aaa5e5ff1f4fdddf76318bd9d0bde031}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e '.[performance]'
      - run: python -m unittest discover -s ../control/tests -p test_reflected_recovery_proof.py -v
      - uses: actions/download-artifact@v4
        with:
          name: pacnerf-inputs
          run-id: '39100239747'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: worker/runs/inputs
      - uses: actions/download-artifact@v4
        with:
          name: bird-reflected-chain-${{ matrix.index }}
          run-id: ${{ inputs.parent_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: worker/runs/chain-${{ matrix.index }}
      - name: Verify immutable source and reference, resume exact saved RNG, prove prefix
        run: >-
          python -u ../control/experiments/recover_bird_reflected.py --worker .
          --source-ref ad3ec582aaa5e5ff1f4fdddf76318bd9d0bde031
          --shard runs/chain-${{ matrix.index }} --inputs runs/inputs
          --index ${{ matrix.index }} --draws ${{ inputs.draws }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bird-reflected-chain-${{ matrix.index }}
          path: worker/runs/chain-${{ matrix.index }}
          retention-days: 30
          if-no-files-found: ignore
  diagnose:
    needs: chain
    if: always() && needs.chain.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run: {working-directory: worker}
    steps:
      - uses: actions/checkout@v4
        with: {path: worker, ref: ad3ec582aaa5e5ff1f4fdddf76318bd9d0bde031}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e '.[performance]'
      - uses: actions/download-artifact@v4
        with:
          name: pacnerf-inputs
          run-id: '39100239747'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: worker/runs/inputs
      - uses: actions/download-artifact@v4
        with: {pattern: bird-reflected-chain-*, path: worker/runs/shards}
      - run: |
          for i in 0 1 2 3; do mv "runs/shards/bird-reflected-chain-$i" "runs/shards/chain-$i"; done
      - run: >-
          python -u scripts/aggregate_pacnerf_reflected.py --inputs runs/inputs
          --shards runs/shards --output runs/diagnostics --draws ${{ inputs.draws }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bird-reflected-diagnostics, path: worker/runs/diagnostics, retention-days: 30, if-no-files-found: ignore}
