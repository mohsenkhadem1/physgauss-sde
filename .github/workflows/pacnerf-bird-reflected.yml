name: Bird reflected interwoven CPU convergence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e '.[performance]'
      - run: python -m unittest discover -s tests -v
      - uses: actions/download-artifact@v4
        with:
          name: pacnerf-inputs
          run-id: '39100239747'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/inputs
      - uses: actions/download-artifact@v4
        with:
          name: bird-recovered-json
          run-id: '39214740152'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/source-json
      - uses: actions/download-artifact@v4
        with:
          name: bird-recovered-states
          run-id: '39214740152'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/source-states
      - name: Freeze proposal using observed data only; discard all parent samples
        run: >-
          python -u scripts/pacnerf_floor_free_reference.py
          --inputs runs/inputs
          --states runs/source-states/bird__4views__constant__marginal
          --settings runs/source-json/bird__4views__constant__marginal/settings.json
          --output runs/reference --mean-anchor
      - uses: actions/upload-artifact@v4
        with: {name: bird-reflected-reference, path: runs/reference, retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: bird-reflected-settings, path: runs/source-json/bird__4views__constant__marginal/settings.json, retention-days: 30}
  chain:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: {index: [0, 1, 2, 3]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e '.[performance]'
      - uses: actions/download-artifact@v4
        with:
          name: pacnerf-inputs
          run-id: '39100239747'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/inputs
      - uses: actions/download-artifact@v4
        with: {name: bird-reflected-reference, path: runs/reference}
      - uses: actions/download-artifact@v4
        with: {name: bird-reflected-settings, path: runs/settings}
      - name: Warm up independently and retain first 256 samples
        run: >-
          python -u experiments/bird_reflected.py
          --inputs runs/inputs --reference runs/reference/reference.pt
          --settings runs/settings/settings.json --output runs/chain-${{ matrix.index }}
          --chain-index ${{ matrix.index }} --seed $((970009 + ${{ matrix.index }}))
          --warmup 500 --draws 256 --interweave
      - uses: actions/upload-artifact@v4
        with: {name: bird-reflected-preview-${{ matrix.index }}, path: 'runs/chain-${{ matrix.index }}', retention-days: 30}
      - name: Continue exact checkpoints to 2000 retained samples
        run: >-
          python -u experiments/bird_reflected.py
          --inputs runs/inputs --reference runs/reference/reference.pt
          --settings runs/settings/settings.json --output runs/chain-${{ matrix.index }}
          --chain-index ${{ matrix.index }} --seed $((970009 + ${{ matrix.index }}))
          --warmup 500 --draws 2000 --interweave
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bird-reflected-chain-${{ matrix.index }}, path: 'runs/chain-${{ matrix.index }}', retention-days: 30, if-no-files-found: ignore}
  diagnose:
    needs: chain
    if: always() && needs.chain.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e '.[performance]'
      - uses: actions/download-artifact@v4
        with:
          name: pacnerf-inputs
          run-id: '39100239747'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/inputs
      - uses: actions/download-artifact@v4
        with: {pattern: bird-reflected-chain-*, path: runs/shards}
      - name: Normalize shard directories
        run: |
          for i in 0 1 2 3; do mv "runs/shards/bird-reflected-chain-$i" "runs/shards/chain-$i"; done
      - name: Gate all physical, innovation, force and normalizer quantities
        run: >-
          python -u scripts/aggregate_pacnerf_reflected.py --inputs runs/inputs
          --shards runs/shards --output runs/diagnostics --draws 2000
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bird-reflected-diagnostics, path: runs/diagnostics, retention-days: 30, if-no-files-found: ignore}
