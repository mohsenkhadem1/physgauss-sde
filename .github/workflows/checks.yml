name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  physics-and-inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: physgauss check
      - run: physgauss demo --quick --output runs/ci-smoke
      - run: physgauss study --quick --output runs/ci-scale-smoke
      - run: physgauss audit --study runs/ci-scale-smoke --source-ref HEAD --output runs/ci-audit --samples 32
      - run: physgauss sample --study runs/ci-scale-smoke --source-ref HEAD --output runs/ci-nonlinear --warmup 20 --draws 32 --evaluation-samples 16 --langevin
      - run: physgauss forces --quick --output runs/ci-forces
      - run: physgauss marginalize --quick --output runs/ci-marginal-forces
      - run: physgauss accurate --quick --output runs/ci-accurate
      - run: physgauss neural-marginalize --quick --output runs/ci-neural-marginal
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-smoke-report
          path: |
            runs/ci-smoke/summary.json
            runs/ci-smoke/report.html
            runs/ci-smoke/preview.png
            runs/ci-scale-smoke/summary.json
            runs/ci-scale-smoke/report.html
            runs/ci-audit/summary.json
            runs/ci-audit/report.html
            runs/ci-nonlinear/summary.json
            runs/ci-nonlinear/report.html
            runs/ci-forces/summary.json
            runs/ci-forces/report.html
            runs/ci-marginal-forces/summary.json
            runs/ci-marginal-forces/report.html
            runs/ci-accurate/summary.json
            runs/ci-accurate/numerical_audit.json
            runs/ci-neural-marginal/summary.json
            runs/ci-neural-marginal/calibration.json
