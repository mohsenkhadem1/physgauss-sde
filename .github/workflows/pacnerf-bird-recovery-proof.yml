name: Bird frozen-checkpoint recovery proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with: {path: control}
      - uses: actions/checkout@v4
        with:
          path: worker
          ref: a14766e33fe7642a681441f7f919be40a2fe1f7e
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e '.[performance]'
      - run: python -m unittest discover -s ../control/tests -p 'test_pacnerf_recovery.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: pacnerf-inputs
          run-id: '39100239747'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: worker/runs/inputs
      - uses: actions/download-artifact@v4
        with:
          name: bird-recovered-json
          run-id: '39214740152'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: worker/runs/source-json
      - uses: actions/download-artifact@v4
        with:
          name: bird-recovered-states
          run-id: '39214740152'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: worker/runs/source-states
      - name: Restore original constants and prove bit-identical real Bird continuation
        run: >-
          python -u ../control/scripts/prove_pacnerf_bird_recovery.py
          --worker . --inputs runs/inputs
          --results runs/source-json/bird__4views__constant__marginal
          --states runs/source-states/bird__4views__constant__marginal
          --output runs/recovery-proof --additional-draws 32
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bird-recovery-proof, path: worker/runs/recovery-proof/**/*.json, retention-days: 30, if-no-files-found: ignore}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bird-recovery-proof-states, path: worker/runs/recovery-proof/**/*.pt, retention-days: 30, if-no-files-found: ignore}
