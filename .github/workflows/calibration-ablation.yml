name: Calibration-only MAP ablation with portable states
on:
  push:
    paths:
      - '.github/workflows/calibration-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [4101, 4102, 4103]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e '.[performance]'
      - run: python -u scripts/audit_calibration_effect.py --seed ${{ matrix.seed }} --output runs/calibration-effect-${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-effect-${{ matrix.seed }}
          path: runs/calibration-effect-${{ matrix.seed }}/**/*.json
          retention-days: 30
