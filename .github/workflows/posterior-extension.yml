name: Fixed-kernel neural posterior extension
on:
  push:
    paths:
      - '.github/workflows/posterior-extension.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: primary
            source_run: '39062694272'
            artifact: posterior-chains-29
          - kind: small_step
            source_run: '39063241871'
            artifact: step-check-chains-29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e '.[performance]'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/source
      - run: python -u scripts/extend_posterior_replica.py --source runs/source --kind ${{ matrix.kind }} --output runs/extended
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-results-${{ matrix.kind }}
          path: runs/extended/**/*.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-chains-${{ matrix.kind }}
          path: runs/extended/**/*.pt
          retention-days: 30
