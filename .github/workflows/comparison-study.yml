name: Matched calibrated-noise comparison
on:
  push:
    paths:
      - '.github/workflows/comparison-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e .
      - run: python -u scripts/parallel_comparison.py --partition ${{ matrix.partition }} --output runs/partition
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-${{ matrix.partition }}
          path: |
            runs/partition/**/*.json
            runs/partition/**/reference.pt
            runs/partition/**/images.pt
          retention-days: 14
  aggregate:
    needs: comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: comparison-*
          merge-multiple: true
          path: runs/comparison
      - run: python scripts/parallel_comparison.py --merge --output runs/comparison
      - uses: actions/upload-artifact@v4
        with:
          name: complete-comparison
          path: runs/comparison
          retention-days: 14
