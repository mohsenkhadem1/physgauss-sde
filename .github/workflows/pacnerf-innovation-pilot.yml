name: PAC innovation coordinates observed-only development pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    name: pilot (${{ matrix.case }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        case: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e '.[performance]'
      - uses: actions/download-artifact@v4
        with:
          name: pacnerf-inputs
          run-id: '39073611351'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/pacnerf-inputs
      - name: Observed-data-only feasibility pilot
        timeout-minutes: 25
        env:
          CASE: ${{ matrix.case }}
        run: python -u scripts/pilot_pacnerf_innovations.py --case-index "$CASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pacnerf-innovation-pilot-${{ matrix.case }}
          path: |
            runs/pacnerf-innovation-pilot/**/*.json
            runs/pacnerf-innovation-pilot/**/*.pt
          retention-days: 30
