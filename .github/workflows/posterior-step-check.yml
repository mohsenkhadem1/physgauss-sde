name: Independent posterior step-size check
on:
  push:
    paths:
      - '.github/workflows/posterior-step-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case: [27, 29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e '.[performance]'
      - run: python -u scripts/check_posterior_step_size.py --case-index ${{ matrix.case }} --output runs/replicate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step-check-results-${{ matrix.case }}
          path: runs/replicate/**/*.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step-check-chains-${{ matrix.case }}
          path: runs/replicate/**/*.pt
          retention-days: 30
