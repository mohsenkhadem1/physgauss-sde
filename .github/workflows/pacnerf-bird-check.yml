name: One Bird posterior and uncertainty check
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bird:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e '.[performance]'
      - uses: actions/download-artifact@v4
        with:
          name: pacnerf-inputs
          run-id: '39100239747'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/pacnerf-inputs
      - name: Density, transport, sampler and repeated-data interval checks
        run: |
          python -m unittest discover -s tests -p 'test_pacnerf_discrepancy.py' -v
          python -m unittest discover -s tests -p 'test_pacnerf_conditioned_transport.py' -v
          python -m unittest discover -s tests -p 'test_pacnerf_floor.py' -v
          python -m unittest discover -s tests -p 'test_pacnerf_bird_readiness.py' -v
          python -m unittest discover -s tests -p 'test_conditioned_reference_curvature.py' -v
          python -m unittest discover -s tests -p 'test_pacnerf_hybrid.py' -v
          python -m unittest discover -s tests -p 'test_pacnerf_warmup_reference.py' -v
          python -m unittest discover -s tests -p 'test_pacnerf_recovery.py' -v
          python -m unittest discover -s tests -p 'test_pacnerf_elliptical.py' -v
          python -m unittest discover -s tests -p 'test_pacnerf_prediction_scores.py' -v
          python scripts/validate_hierarchical_intervals.py --output runs/validation
          python scripts/validate_floor_intervals.py --datasets 10000 --output runs/validation/floor
      - name: One complete Bird posterior with strict convergence checks
        timeout-minutes: 330
        run: python -u scripts/compare_pacnerf_discrepancy.py --inputs runs/pacnerf-inputs --output runs/bird --case-index 8
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bird-json, path: 'runs/bird/**/*.json', retention-days: 30, if-no-files-found: ignore}
      - name: Exclude interrupted temporary checkpoint writes
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('runs/bird').rglob('*.tmp.pt'):
              p.unlink()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bird-states, path: 'runs/bird/**/*.pt', retention-days: 30, if-no-files-found: ignore}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bird-linear-validation, path: runs/validation, retention-days: 30, if-no-files-found: ignore}
  recovery:
    needs: bird
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e '.[performance]'
      - uses: actions/download-artifact@v4
        with:
          name: pacnerf-inputs
          run-id: '39100239747'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/pacnerf-inputs
      - uses: actions/download-artifact@v4
        with: {name: bird-json, path: runs/bird}
      - uses: actions/download-artifact@v4
        with: {name: bird-states, path: runs/bird}
      - name: Exact checkpoint continuation if the first worker timed out
        timeout-minutes: 330
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          if not list(Path('runs/bird').glob('*/summary.json')):
              subprocess.run(['python','-u','scripts/compare_pacnerf_discrepancy.py','--inputs','runs/pacnerf-inputs','--output','runs/bird','--case-index','8'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bird-recovered-json, path: 'runs/bird/**/*.json', retention-days: 30, if-no-files-found: ignore}
      - name: Exclude interrupted temporary writes
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('runs/bird').rglob('*.tmp.pt'):
              p.unlink()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bird-recovered-states, path: 'runs/bird/**/*.pt', retention-days: 30, if-no-files-found: ignore}
  report:
    needs: recovery
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.0 -e '.[performance]'
      - uses: actions/download-artifact@v4
        with: {name: bird-recovered-json, path: runs/raw/results-8}
      - uses: actions/download-artifact@v4
        with: {name: bird-recovered-states, path: runs/raw/chains-8}
      - uses: actions/download-artifact@v4
        with:
          name: pacnerf-inputs
          run-id: '39100239747'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/pacnerf-inputs
      - uses: actions/download-artifact@v4
        with:
          name: pacnerf-results-8
          run-id: '39100239747'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/baseline/results-8
      - uses: actions/download-artifact@v4
        with:
          name: pacnerf-chains-8
          run-id: '39100239747'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/baseline/chains-8
      - name: Independently replay and publish the single-case result
        run: python -u scripts/publish_pacnerf_bird_check.py --raw runs/raw --inputs runs/pacnerf-inputs --baseline runs/baseline --output runs/bird-report --name pacnerf-bird-${{ github.run_id }} --push
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bird-check-report, path: runs/bird-report, retention-days: 30, if-no-files-found: ignore}
      - name: Start the free CPU comparison only after independently verified Bird readiness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          decision=json.loads(Path('runs/bird-report/readiness.json').read_text())
          if decision['ready_for_larger_comparison']:
              subprocess.run(['gh','workflow','run','pacnerf-discrepancy.yml','--ref','main','-f','bird_run='+os.environ['GITHUB_RUN_ID']],check=True)
              print('Passing Bird report: dispatched the gated free CPU comparison.')
          else:
              print('Bird readiness failed: no larger comparison dispatched.')
          PY
