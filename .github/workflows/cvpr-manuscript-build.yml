name: Compile CVPR 2027 manuscript
on:
  push:
    branches: [main]
    paths:
      - 'papers/cvpr2027-joint-identification/main.tex'
      - 'papers/cvpr2027-joint-identification/supplement.tex'
      - 'papers/cvpr2027-joint-identification/references.bib'
      - 'papers/cvpr2027-joint-identification/sections/**'
      - 'papers/cvpr2027-joint-identification/figures/**'
      - '.github/workflows/cvpr-manuscript-build.yml'
  workflow_dispatch:
concurrency:
  group: cvpr-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            papers
            scripts
            reports
            output
          sparse-checkout-cone-mode: true
      - name: Install TeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-bibtex-extra
      - name: Generate the sealed-score chart and terminology-correct teaser
        run: |
          python -m pip install --quiet numpy matplotlib pillow pymupdf
          python papers/cvpr2027-joint-identification/figures/make_benchmark_summary.py --repo .
          python papers/cvpr2027-joint-identification/figures/make_task_teaser.py --repo .
      - name: Compile anonymous review paper and supplement
        run: |
          set -euo pipefail
          cd papers/cvpr2027-joint-identification
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error supplement.tex
          test -s main.pdf && test -s supplement.pdf
          pdfinfo main.pdf | grep Pages
          pdfinfo supplement.pdf | grep Pages
      - name: Regenerate standalone LaTeX source ZIP
        run: |
          python scripts/joint_field_identification/package_paper.py
      - name: Upload PDF build outputs
        uses: actions/upload-artifact@v4
        with:
          name: cvpr2027-papers
          path: |
            papers/cvpr2027-joint-identification/main.pdf
            papers/cvpr2027-joint-identification/supplement.pdf
      - name: Commit PDFs to main
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/cvpr2027-joint-identification/main.pdf papers/cvpr2027-joint-identification/supplement.pdf papers/cvpr2027-joint-identification/release/latex-source.zip papers/cvpr2027-joint-identification/release/source-manifest.json papers/cvpr2027-joint-identification/figures/task-teaser.pdf
          git add -f papers/cvpr2027-joint-identification/figures/benchmark-summary.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Build revised CVPR paper and supplement PDFs [skip ci]'
            git push
          fi
