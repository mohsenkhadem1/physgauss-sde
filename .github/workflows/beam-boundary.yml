name: Gaussian boundary beam benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/beam_boundary.py'
      - 'experiments/run_beam_boundary.py'
      - 'tests/test_beam_boundary.py'
      - 'configs/beam_boundary.json'
      - '.github/workflows/beam-boundary.yml'
permissions:
  contents: read
jobs:
  beam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.0.0 matplotlib==3.9.2
      - run: python -m unittest discover -s tests -p test_beam_boundary.py -v
      - run: python -u experiments/run_beam_boundary.py --config configs/beam_boundary.json --output runs/beam-boundary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaussian-boundary-beam
          path: runs/beam-boundary
          retention-days: 30
      - name: Check the matched-model scalar calibration gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('runs/beam-boundary/results.json').read_text())
          assert report['simulation_audit']['pass']
          assert report['prior_predictive_scalar_calibration_gate_pass']
          print('Matched-model reference checks passed. Stress-test failures remain in the report.')
          PY
