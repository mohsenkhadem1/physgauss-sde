name: Bounded Bird posterior follow-up
on:
  workflow_run:
    workflows: ['Bird reflected interwoven CPU convergence']
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: reflected-bird-followup-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  route:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.4'}
      - run: python -m unittest discover -s tests -p test_reflected_routing.py -v
      - uses: actions/download-artifact@v4
        with:
          name: bird-reflected-diagnostics
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runs/diagnostics
      - name: Extend only this posterior within cap, or independently validate uncertainty
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIRD_PARENT_RUN: ${{ github.event.workflow_run.id }}
        run: >-
          python -u experiments/route_reflected_bird.py
          --report runs/diagnostics/convergence.json --parent-run "$BIRD_PARENT_RUN"
          --output runs/route/route.json --dispatch
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bird-reflected-followup-decision, path: runs/route, retention-days: 30, if-no-files-found: ignore}
